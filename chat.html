<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 상담실 - DJ 명리</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+KR:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
        <i class="ph ph-list"></i>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-container" id="main-app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="ph ph-sparkle"></i>
                    <span>AI 명리</span>
                </div>
            </div>

            <div id="auth-section"></div>

            <div class="api-key-section" style="display: none;">
                <label for="apiKeyInput" style="font-size: 0.7rem;">Gemini API 키</label>
                <div class="key-input-wrapper">
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="mini-input">
                    <button id="saveKeyBtn" class="icon-btn"><i class="ph ph-check"></i></button>
                </div>
            </div>

            <div class="saju-input-section">
                <h4><i class="ph ph-identification-card"></i> 사주 정보 입력</h4>
                <div class="saju-form">
                    <input type="text" id="saju-name" placeholder="이름" class="mini-input">
                    <select id="saju-calendar" class="mini-input">
                        <option value="양력">양력</option>
                        <option value="음력">음력</option>
                        <option value="음력(윤달)">음력(윤달)</option>
                    </select>
                    <input type="date" id="saju-birth" class="mini-input" value="1990-01-01">
                    <select id="saju-time" class="mini-input">
                        <option value="모름">시간 모름</option>
                        <option value="子時(23:30~01:30)">子時 (23:30~01:30)</option>
                        <option value="丑時(01:30~03:30)">丑時 (01:30~03:30)</option>
                        <option value="寅時(03:30~05:30)">寅時 (03:30~05:30)</option>
                        <option value="卯時(05:30~07:30)">卯時 (05:30~07:30)</option>
                        <option value="辰時(07:30~09:30)">辰時 (07:30~09:30)</option>
                        <option value="巳時(09:30~11:30)">巳時 (09:30~11:30)</option>
                        <option value="午時(11:30~13:30)">午時 (11:30~13:30)</option>
                        <option value="未時(13:30~15:30)">未時 (13:30~15:30)</option>
                        <option value="申時(15:30~17:30)">申時 (15:30~17:30)</option>
                        <option value="酉時(17:30~19:30)">酉時 (17:30~19:30)</option>
                        <option value="戌時(19:30~21:30)">戌時 (19:30~21:30)</option>
                        <option value="亥時(21:30~23:30)">亥時 (21:30~23:30)</option>
                    </select>
                    <select id="saju-gender" class="mini-input">
                        <option value="남성">남성</option>
                        <option value="여성">여성</option>
                    </select>
                    <button id="saju-submit-btn" class="submit-btn">
                        <i class="ph ph-magnifying-glass"></i> 사주 조회
                    </button>
                </div>
            </div>

            <div class="analysis-card">
                <h4><i class="ph ph-star-four"></i> 일간 (본원) 분석</h4>
                <p id="day-master-desc">대화창에 생년월일을 입력하면 이곳에 분석 결과가 표시됩니다.</p>
            </div>

            <div class="query-history-section" id="query-history-section" style="display:none;">
                <div class="section-title"
                    style="margin-top: 0.5rem; font-size: 0.7rem; display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="ph ph-users-three"></i> 조회 목록</span>
                    <button id="clear-all-queries" title="전체 초기화"
                        style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.7rem;padding:2px 6px;border-radius:4px;transition:color 0.2s,background 0.2s;"
                        onmouseover="this.style.color='#ef4444';this.style.background='rgba(239,68,68,0.1)'"
                        onmouseout="this.style.color='var(--text-muted)';this.style.background='none'"><i
                            class="ph ph-trash"></i> 초기화</button>
                </div>
                <div class="query-list" id="query-list"></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html"><i class="ph ph-house"></i> 간단 해설</a>
                <a href="deep.html"><i class="ph ph-magnifying-glass-plus"></i> 심층 상담</a>
                <a href="daeun.html"><i class="ph ph-chart-line-up"></i> 대운 흐름</a>
                <a href="seun.html"><i class="ph ph-calendar-dots"></i> 세운 분석</a>
                <a href="chat.html" class="active"><i class="ph ph-chat-circle-text"></i> AI 상담실 <span
                        style="font-size:.6rem;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px">PRO</span></a>
                <button class="theme-toggle" id="theme-toggle">
                    <span class="theme-icon"><i class="ph ph-moon"></i></span>
                    <span class="theme-label">라이트 모드</span>
                </button>
            </nav>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-interface">
            <header class="chat-header">
                <div class="agent-info">
                    <div class="agent-avatar"><i class="ph ph-magic-wand"></i></div>
                    <div>
                        <h3>AI 사주 마스터</h3>
                        <span class="status-indicator">운명 상담 중</span>
                    </div>
                </div>
            </header>

            <div class="chat-messages" id="chat-history">
                <div class="message ai-message system-notice">
                    <div class="bubble">
                        <p>안녕하세요. 당신의 운명 전략을 믹싱해드릴 <strong>DJ 명리</strong>입니다.</p>
                        <p>화면 왼쪽 '사주 정보 입력' 창에 성명과 생년월일시 등의 정보를 먼저 입력해주세요.</p>
                        <p>입력한 정보는 '조회 목록'에서 확인 및 관리할 수 있습니다.</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="suggestion-chips" id="suggestion-chips">
                    <button>💰 올해 재물운은?</button>
                    <button>💘 연애/결혼운 보기</button>
                    <button>💼 직장/진로 고민</button>
                </div>
                <div class="input-wrapper">
                    <button class="attach-btn"><i class="ph ph-plus-circle"></i></button>
                    <input type="text" id="user-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button class="send-btn" id="send-btn"><i class="ph ph-paper-plane-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="manseryeok.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
    <script src="credits.js"></script>
    <script>
        // 크레딧 시스템 초기화
        (function () {
            window.SajuCredits.initFirstVisit();
            window.SajuCredits.injectBadge();
            window.SajuCredits.updateBadge();
        })();
    </script>
</body>

</html>
