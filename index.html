<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단 해설 - DJ 명리</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+KR:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* ===== 간단 해설 페이지 전용 CSS ===== */
        .overview-page {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .overview-page h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.5rem;
            margin-bottom: .3rem;
            color: var(--text-primary);
        }

        .ov-subtitle {
            color: var(--text-muted);
            font-size: .85rem;
            margin-bottom: 1.5rem;
        }

        .ov-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 1rem;
            font-size: .95rem;
        }

        .ov-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .ov-card-badge {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: .8rem;
        }

        .ov-hero {
            text-align: center;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-elevated));
        }

        .ov-hero-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin: .3rem 0;
        }

        .ov-hero-nature {
            font-size: .85rem;
            color: var(--text-muted);
            margin-bottom: .7rem;
        }

        .ov-hero-desc {
            font-size: .88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        .ov-pillars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .8rem;
            margin-bottom: 1rem;
        }

        .ov-pillar {
            text-align: center;
        }

        .ov-pillar-label {
            font-size: .65rem;
            color: var(--text-muted);
            margin-bottom: .3rem;
        }

        .ov-pillar-stem,
        .ov-pillar-branch {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .ov-pillar-el {
            font-size: .6rem;
            color: var(--text-muted);
            margin-top: .2rem;
        }

        .ov-relations {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-top: .5rem;
        }

        .ov-rel-tag {
            font-size: .7rem;
            border: 1px solid;
            padding: .2rem .5rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .ov-elem-bars {
            display: flex;
            flex-direction: column;
            gap: .5rem;
        }

        .ov-elem-row {
            display: flex;
            align-items: center;
            gap: .6rem;
        }

        .ov-elem-label {
            width: 55px;
            font-size: .78rem;
            font-weight: 600;
            text-align: right;
        }

        .ov-elem-bar {
            flex: 1;
            height: 20px;
            background: var(--bg-elevated);
            border-radius: 10px;
            overflow: hidden;
        }

        .ov-elem-fill {
            height: 100%;
            border-radius: 10px;
            transition: width .6s ease;
        }

        .ov-elem-pct {
            font-size: .7rem;
            color: var(--text-muted);
            width: 65px;
        }

        .ov-balance-advice {
            margin-top: .8rem;
            font-size: .82rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: .8rem;
            background: var(--bg-elevated);
            border-radius: 10px;
        }

        .ov-summary {
            text-align: center;
            background: linear-gradient(135deg, rgba(167, 139, 250, .08), rgba(236, 72, 153, .08));
        }

        .ov-summary-text {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.7;
            color: var(--text-primary);
            font-style: italic;
        }

        .ov-premium-cta {
            text-align: center;
            background: linear-gradient(135deg, rgba(167, 139, 250, .12), rgba(236, 72, 153, .12));
            border-color: rgba(167, 139, 250, .3);
        }

        .ov-premium-emoji {
            font-size: 2.5rem;
            margin-bottom: .5rem;
        }

        .ov-premium-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: .4rem;
        }

        .ov-premium-desc {
            font-size: .82rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .ov-premium-links {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            justify-content: center;
        }

        .ov-link-btn {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .5rem 1rem;
            border-radius: 10px;
            font-size: .8rem;
            font-weight: 500;
            text-decoration: none;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: all .2s;
        }

        .ov-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
        }

        .ov-link-pro {
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            color: #fff;
            border-color: transparent;
        }

        @media (max-width:600px) {
            .overview-page {
                padding: 1rem;
            }

            .ov-pillars {
                gap: .4rem;
            }

            .ov-pillar-stem,
            .ov-pillar-branch {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
        <i class="ph ph-list"></i>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-container" id="main-app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="ph ph-sparkle"></i>
                    <span>AI 명리</span>
                </div>
            </div>

            <div id="auth-section"></div>

            <div class="saju-input-section">
                <h4><i class="ph ph-identification-card"></i> 사주 정보 입력</h4>
                <div class="saju-form">
                    <input type="text" id="saju-name" placeholder="이름" class="mini-input">
                    <select id="saju-calendar" class="mini-input">
                        <option value="양력">양력</option>
                        <option value="음력">음력</option>
                        <option value="음력(윤달)">음력(윤달)</option>
                    </select>
                    <input type="date" id="saju-birth" class="mini-input" value="1990-01-01">
                    <select id="saju-time" class="mini-input">
                        <option value="모름">시간 모름</option>
                        <option value="子時(23:30~01:30)">子時 (23:30~01:30)</option>
                        <option value="丑時(01:30~03:30)">丑時 (01:30~03:30)</option>
                        <option value="寅時(03:30~05:30)">寅時 (03:30~05:30)</option>
                        <option value="卯時(05:30~07:30)">卯時 (05:30~07:30)</option>
                        <option value="辰時(07:30~09:30)">辰時 (07:30~09:30)</option>
                        <option value="巳時(09:30~11:30)">巳時 (09:30~11:30)</option>
                        <option value="午時(11:30~13:30)">午時 (11:30~13:30)</option>
                        <option value="未時(13:30~15:30)">未時 (13:30~15:30)</option>
                        <option value="申時(15:30~17:30)">申時 (15:30~17:30)</option>
                        <option value="酉時(17:30~19:30)">酉時 (17:30~19:30)</option>
                        <option value="戌時(19:30~21:30)">戌時 (19:30~21:30)</option>
                        <option value="亥時(21:30~23:30)">亥時 (21:30~23:30)</option>
                    </select>
                    <select id="saju-gender" class="mini-input">
                        <option value="남성">남성</option>
                        <option value="여성">여성</option>
                    </select>
                    <button id="saju-submit-btn" class="submit-btn">
                        <i class="ph ph-magnifying-glass"></i> 사주 조회
                    </button>
                </div>
            </div>

            <div class="query-history-section" id="query-history-section" style="display:none;">
                <div class="section-title"
                    style="margin-top: 0.5rem; font-size: 0.7rem; display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="ph ph-users-three"></i> 조회 목록</span>
                    <button id="clear-all-queries" title="전체 초기화"
                        style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.7rem;padding:2px 6px;border-radius:4px;transition:color 0.2s,background 0.2s;"
                        onmouseover="this.style.color='#ef4444';this.style.background='rgba(239,68,68,0.1)'"
                        onmouseout="this.style.color='var(--text-muted)';this.style.background='none'"><i
                            class="ph ph-trash"></i> 초기화</button>
                </div>
                <div class="query-list" id="query-list"></div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="active"><i class="ph ph-house"></i> 간단 해설</a>
                <a href="deep.html"><i class="ph ph-magnifying-glass-plus"></i> 심층 상담</a>
                <a href="daeun.html"><i class="ph ph-chart-line-up"></i> 대운 흐름</a>
                <a href="seun.html"><i class="ph ph-calendar-dots"></i> 세운 분석</a>
                <a href="chat.html"><i class="ph ph-chat-circle-text"></i> AI 상담실 <span
                        style="font-size:.6rem;background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px">PRO</span></a>
                <button class="theme-toggle" id="theme-toggle">
                    <span class="theme-icon"><i class="ph ph-moon"></i></span>
                    <span class="theme-label">라이트 모드</span>
                </button>
            </nav>
        </aside>

        <!-- Main: 간단 해설 컨텐츠 -->
        <main class="overview-page" id="overview-content">
            <div class="ov-empty">
                <p>🔮 왼쪽 사이드바에서 사주 정보를 입력해 주세요.</p>
            </div>
        </main>
    </div>

    <script src="manseryeok.js"></script>
    <script src="auth.js"></script>
    <script src="overview.js"></script>
</body>

</html>
